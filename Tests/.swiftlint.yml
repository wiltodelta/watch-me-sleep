# Test cases grow with the scenarios they cover; body and file length limits
# are for production types.
disabled_rules:
  - type_body_length
  - file_length

# Fixtures inside multiline strings are verbatim CLI output and payloads;
# wrapping them would change what the test feeds the parser.
line_length:
  warning: 120
  error: 200
  ignores_multiline_strings: true
